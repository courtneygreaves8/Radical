<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#d86637" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Radical Church — Norwich. Loving Jesus, loving each other, and loving the lost. Sundays 10:30 at City Gates Centre."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Anybody:wdth,wght@125..200,700..900&family=JetBrains+Mono:wght@400;500;700&family=Rock+Salt&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Radical Church | Norwich</title>
    <script>
      ;(function () {
        try {
          sessionStorage.removeItem('radical-site-blue')
          sessionStorage.removeItem('radical-site-baby')
          if (sessionStorage.getItem('radical-site-deep') !== '1') return
          var r = document.documentElement
          r.classList.add('site-deep')
          r.dataset.brand = 'deep'
          r.style.setProperty('--lime', '#0066ff')
          r.style.setProperty('--lime-foreground', '#ffffff')
          r.style.setProperty('--crimson', '#0066ff')
          r.style.setProperty('--flame', '#0066ff')
          r.style.setProperty('--accent', '#0066ff')
          r.style.setProperty('--accent-foreground', '#ffffff')
          r.style.setProperty('--primary-foreground', '#0066ff')
          r.style.setProperty('--ring', '#0066ff')
          r.style.setProperty('--destructive', '#0033aa')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
