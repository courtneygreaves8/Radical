<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Radical Church — Norwich. Loving Jesus, loving each other, and loving the lost. Sundays 10:30 at City Gates Centre."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Anybody:wdth,wght@125..200,700..900&family=JetBrains+Mono:wght@400;500;700&family=Lexend:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Radical Church | Norwich</title>
    <script>
      ;(function () {
        try {
          if (localStorage.getItem('radical-dyslexia-mode') !== 'on') return
          var r = document.documentElement
          r.dataset.dyslexia = 'on'
          var t = {
            '--paper': '#e8f7ee',
            '--background': '#e8f7ee',
            '--card': '#e8f7ee',
            '--popover': '#e8f7ee',
            '--mute': '#cfead8',
            '--muted': '#cfead8',
            '--secondary': '#cfead8',
            '--ink': '#1a2420',
            '--foreground': '#1a2420',
            '--card-foreground': '#1a2420',
            '--popover-foreground': '#1a2420',
            '--primary': '#1a2420',
            '--secondary-foreground': '#1a2420',
            '--border': '#1a2420',
            '--input': '#1a2420',
            '--lime': '#12b85c',
            '--lime-foreground': '#04140a',
            '--accent': '#12b85c',
            '--accent-foreground': '#04140a',
            '--primary-foreground': '#12b85c',
            '--ring': '#12b85c',
            '--crimson': '#1a5cff',
            '--flame': '#1a5cff',
            '--navy': '#0f2a1c',
            '--muted-foreground': '#3a4a42',
            '--destructive': '#1a5cff',
          }
          for (var k in t) r.style.setProperty(k, t[k])
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
